<html>
<head>
  <title>Obby Aimbot Fullscreen</title>
  <style>
    .play-button { padding: 20px 40px; background: #000; color: #fff; border: 2px solid #4a148c; border-radius: 10px; font: bold 24px Arial; cursor: pointer; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; }
    .play-button:hover { background: #4a148c; }
    .fullscreen-button { padding: 10px 15px; background: #000; color: #fff; border: 2px solid #4a148c; border-radius: 5px; font: bold 14px Arial; cursor: pointer; position: fixed; bottom: 20px; right: 20px; z-index: 1002; }
    .fullscreen-button:hover { background: #4a148c; }
    body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%; }
    .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 1000; }
    .spinner { border: 4px solid #4a148c; border-top: 4px solid #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { color: #fff; font-size: 18px; font-family: Arial; }
  </style>
</head>
<body>
<div id="container">
  <iframe id="fr" width="100%" height="100%" frameborder="0" allowfullscreen=""></iframe>
  <button class="play-button" type="button" onclick="PlayTo(this)" id="playBtn">PLAY OBBY AIMBOT</button>
  <button class="fullscreen-button" type="button" onclick="openFullscreen()">FULLSCREEN</button>
  <div class="loading" id="loading" style="display:none;">
    <div class="spinner"></div>
    <div class="loading-text">Loading Game...</div>
  </div>
</div>

<script>
// Parent listener
window.addEventListener('message', (ev) => {
  const msg = ev.data;
  if (!msg || !msg.type) return;

  if (msg.type === 'UNITY_SAVE') {
    localStorage.setItem('unity_save_' + msg.key, msg.data);
    ev.source.postMessage({ type:'UNITY_SAVE_ACK', key: msg.key }, ev.origin);
  }

  if (msg.type === 'UNITY_LOAD_REQ') {
    const data = localStorage.getItem('unity_save_' + msg.key);
    ev.source.postMessage({ type:'UNITY_LOAD_RESP', key: msg.key, data: data }, ev.origin);
  }
});
</script>

<script>
  const DB_NAME = 'GameCacheDB';
  const STORE_NAME = 'GameFiles';
  const CACHE_DURATION = 30 * 24 * 60 * 60 * 1000; // 30 days
  const FILE_URL = 'https://cdn.jsdelivr.net/gh/kelsimsk/956785956785@main/2.xml';
  let cachedContent = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'url' });
        }
      };
      request.onsuccess = (event) => resolve(event.target.result);
      request.onerror = (event) => reject(event.target.error);
    });
  }

  async function saveToCache(url, content) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put({ url: url, content: content, timestamp: Date.now() });
        request.onsuccess = () => resolve();
        request.onerror = () => reject(new Error('Cache error'));
      });
    } catch (err) {
      console.log('Cache save error:', err);
    }
  }

  async function getFileFromCache(url) {
    if (cachedContent) return cachedContent;
    
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(url);
        request.onsuccess = async (event) => {
          const data = event.target.result;
          if (data && (Date.now() - data.timestamp) < CACHE_DURATION) {
            cachedContent = data.content;
            resolve(data.content);
          } else {
            try {
              const response = await fetch(url, { cache: 'force-cache' });
              const text = await response.text();
              cachedContent = text;
              await saveToCache(url, text);
              resolve(text);
            } catch (err) {
              reject(err);
            }
          }
        };
        request.onerror = async () => {
          try {
            const response = await fetch(url, { cache: 'force-cache' });
            const text = await response.text();
            cachedContent = text;
            resolve(text);
          } catch (err) {
            reject(err);
          }
        };
      });
    } catch (err) {
      const response = await fetch(url, { cache: 'force-cache' });
      const text = await response.text();
      cachedContent = text;
      return text;
    }
  }

  function PlayTo(button) {
    const iframe = document.getElementById("fr");
    const loading = document.getElementById("loading");
    loading.style.display = "block";
    
    getFileFromCache(FILE_URL).then((text) => {
      iframe.contentDocument.open();
      iframe.contentDocument.write(text);
      iframe.contentDocument.close();
      iframe.style.display = "block";
      button.style.display = "none";
      loading.style.display = "none";
      
      // Request fullscreen
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen().catch(err => console.log(err));
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      } else if (iframe.mozRequestFullScreen) {
        iframe.mozRequestFullScreen();
      } else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
      }
    }).catch((err) => {
      console.error('Error:', err);
      loading.style.display = "none";
      alert('Game failed to load.');
    });
  }

  function openFullscreen() {
    const loading = document.getElementById("loading");
    loading.style.display = "block";
    
    getFileFromCache(FILE_URL).then((text) => {
      const newWindow = window.open("", "_blank");
      if (newWindow) {
        newWindow.document.open();
        newWindow.document.write(text);
        newWindow.document.close();
        loading.style.display = "none";
        
        // Request fullscreen on new window
        setTimeout(() => {
          if (newWindow.document.documentElement.requestFullscreen) {
            newWindow.document.documentElement.requestFullscreen().catch(err => console.log(err));
          } else if (newWindow.document.documentElement.webkitRequestFullscreen) {
            newWindow.document.documentElement.webkitRequestFullscreen();
          } else if (newWindow.document.documentElement.mozRequestFullScreen) {
            newWindow.document.documentElement.mozRequestFullScreen();
          } else if (newWindow.document.documentElement.msRequestFullscreen) {
            newWindow.document.documentElement.msRequestFullscreen();
          }
        }, 500);
      } else {
        loading.style.display = "none";
        alert('Fullscreen could not be opened.');
      }
    }).catch((err) => {
      console.error('Error:', err);
      loading.style.display = "none";
      alert('Fullscreen failed to load.');
    });
  }

  // Preload game on page load (no auto-play, just load in background)
  window.addEventListener('load', function() {
    getFileFromCache(FILE_URL).catch(err => console.log('Preload error:', err));
  });

  // Auto-play after a short delay to show loading
  setTimeout(() => {
    const playButton = document.querySelector('.play-button');
    PlayTo(playButton);
  }, 500);
</script>
</body>
</html>
